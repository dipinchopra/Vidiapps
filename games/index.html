<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play games from Vidi Apps, right in your browser.">
  <title>Games | Vidi Apps</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #080808; color: #fff; font: 17px/1.6 'Russo One', sans-serif; }
    main { max-width: 960px; margin: auto; padding: 40px 24px 80px; }
    a { color: inherit; }
    .home { text-decoration: none; font-size: 22px; }
    h1 { font-size: clamp(40px, 8vw, 68px); line-height: 1.1; margin: 64px 0 16px; }
    h1, h2 { font-weight: 400; }
    p { color: #aaa; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 24px; margin-top: 40px; }
    article { border: 1px solid #333; border-radius: 24px; padding: 28px; background: #111; }
    img { width: 160px; height: 160px; object-fit: contain; display: block; }
    h2 { margin: 20px 0 8px; }
    .play { display: inline-block; margin-top: 12px; padding: 12px 24px; border-radius: 999px; color: #111; background: white; text-decoration: none; font-weight: 400; }
    .play:hover { background: #d9f2ff; }
    a:focus-visible { outline: 3px solid #68ddff; outline-offset: 5px; }
    footer { margin-top: 64px; color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <a class="home" href="/">Vidi Apps</a>
    <h1>Games</h1>
    <p>A little challenge. A lot of fun. Play right in your browser.</p>
    <div class="games">
      <article>
        <img src="./clean-pour/assets/ui/logo.png" alt="Clean Pour" width="160" height="160">
        <h2>Clean Pour</h2>
        <p>Hold to pour. Release at the line. Test your timing across 30 levels.</p>
        <a class="play" href="./clean-pour/" target="_blank" rel="noopener noreferrer" aria-label="Play Clean Pour (opens in a new tab or window)">Play Clean Pour ↗</a>
      </article>
    </div>
    <footer>© Vidi Studio LLP</footer>
  </main>
</body>
</html>
